<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Echo — incident memory for safer response</title>
  <desc id="desc">A soft green banner showing an incident moving through recall, review, and a verified team lesson.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74cba6"/>
      <stop offset="1" stop-color="#30ad7f"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fff3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e8fff3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1400" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="22" fill="url(#dots)"/>
  <circle cx="1210" cy="100" r="270" fill="url(#orb)"/>
  <path d="M0 300c170-55 277-45 420-2s245 40 389-7 332-80 591-21v90H0z" fill="#eafff4" opacity=".16"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="88" y="89" font-size="18" font-weight="700" letter-spacing="5" opacity=".9">INCIDENT RESPONSE MEMORY</text>
    <text x="82" y="192" font-size="86" font-weight="750" letter-spacing="-5">Echo</text>
    <text x="88" y="240" font-size="25" font-weight="500" opacity=".96">Remember what worked. Verify what is different.</text>
    <text x="88" y="291" font-size="16" font-weight="600" letter-spacing="1.4" opacity=".88">RECALL  ·  INVESTIGATE  ·  REVIEW SAFETY  ·  SAVE VERIFIED LESSONS</text>
  </g>
  <g transform="translate(918 83)" fill="none" stroke="#fff" stroke-width="2.5" opacity=".88">
    <path d="M42 92h95c30 0 34-47 65-47h34m-194 95h92c32 0 41 42 73 42h36" stroke-linecap="round"/>
    <path d="M247 45h58m-58 137h58" stroke-linecap="round"/>
    <path d="M305 45h50m-50 137h50" stroke-linecap="round" opacity=".7"/>
    <circle cx="42" cy="92" r="34" fill="#fff" fill-opacity=".15"/>
    <circle cx="42" cy="92" r="16" fill="#fff" fill-opacity=".92" stroke="none"/>
    <circle cx="305" cy="45" r="28" fill="#fff" fill-opacity=".14"/>
    <circle cx="305" cy="182" r="28" fill="#fff" fill-opacity=".14"/>
    <circle cx="355" cy="45" r="7" fill="#fff" stroke="none"/>
    <circle cx="355" cy="182" r="7" fill="#fff" stroke="none"/>
    <path d="M295 45h20m-10-10v20M295 182h20m-10-10v20" stroke-width="2"/>
  </g>
  <text x="1270" y="318" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#fff" opacity=".74">HUMAN-IN-THE-LOOP BY DESIGN</text>
</svg>
